<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 300px; padding: 15px; font-family: sans-serif; }
    h3 { margin-top: 0; }
    button {
      width: 100%;
      padding: 10px;
      background: #238636;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 10px;
    }
    button:hover { background: #2ea043; }
    input { width: 100%; padding: 8px; box-sizing: border-box; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h3>Ticket Parser Helper</h3>
  <p style="font-size: 12px; color: #666;">
    Select text on any page (like WhatsApp Web), right-click, and choose <b>"⚡ Parse Ticket Offer"</b>.
  </p>
  <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
  
  <label style="font-size: 12px;">Target URL:</label>
  <input type="text" id="targetUrl" value="http://localhost:8000" />
  <button id="saveBtn">Save URL</button>
  <button id="openBtn" style="background: #1f6feb;">Open Ticket Manager</button>

  <script src="popup.js"></script>
</body>
</html>
